name: Reservation database tests

on:
  pull_request:
    paths:
      - '.github/workflows/reservation-db-tests.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/App.jsx'
      - 'src/lib/reservationReadModel.js'
      - 'src/lib/reservationReadModel.test.js'
      - 'src/lib/reservationReadShadow.js'
      - 'src/lib/supabase.js'
      - 'supabase/**'
      - 'docs/reservation-migration/**'
      - 'PROJECT_STATUS.md'
      - 'PRODUCT_CONTEXT.md'
      - 'TECHNICAL_CONTEXT.md'
      - 'PROJECT_HISTORY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservation-db-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiger_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Reservation migration and concurrency tests
        env:
          PHASE3B_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/tiger_test
        run: pnpm run test:reservation

      - name: Run Reservation read adapter tests
        run: pnpm run test:reservation-read

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
